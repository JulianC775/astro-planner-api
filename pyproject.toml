[project]
name = "astro-planner-api"
version = "0.1.0"
description = "REST API for astrophotography and stargazing session planning"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "ephem>=4.1",
    "pydantic-settings>=2.7",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
